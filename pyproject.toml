[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnimind"
version = "0.1.0"
description = "Enterprise RAG/agent platform with hybrid search and citation-backed answers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.0.0",
    "miniopy-async>=1.20",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pinecone>=4.1.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    # Dependency-light document extraction (parsing/light_parsers.py). These are
    # pure-Python and tiny; they are the parsing path whenever the `full` extra
    # below is not installed.
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "langfuse>=2.0.0",
    "langgraph>=0.2.0",
    "duckduckgo-search>=6.0.0",
    # langchain-text-splitters removed 2026-09-18: its package __init__ eagerly
    # imports a sentence-transformers splitter, pulling PyTorch into memory (453 MB
    # resident) purely to split strings. chunking/splitters.py implements the two
    # splitters this project actually used.
    "networkx>=3.0",
]

[project.optional-dependencies]
# Layout-aware parsing (Docling: tables kept as tables, figures extracted for vision
# captioning) and local cross-encoder reranking (FlashRank). Split out because they
# pull PyTorch, transformers and timm — roughly 3GB of image and several hundred MB
# resident, which a 512MB host cannot hold.
#
#   Full quality (local dev, VPS):  pip install -e ".[dev,full]"
#   Slim deployment (free tiers):   pip install .
#
# Without this extra, parsing falls back to parsing/light_parsers.py and reranking
# uses the Cohere API with no local fallback. Retrieval, citations, the critic and
# voice mode are identical either way.
full = [
    "docling>=2.0.0",
    "sentence-transformers>=3.0.0",
    "timm>=1.0.0",
    "einops>=0.8.0",
    "flashrank>=0.2.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ragas>=0.1.10",
]

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "security",
    "ingestion",
    "parsing",
    "chunking",
    "retrieval",
    "reranking",
    "agents",
    "core",
    "model_gateway",
    "evaluation",
    "observability",
    "workers",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "B008",  # Depends() in function defaults is the FastAPI pattern
]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "security",
    "ingestion",
    "parsing",
    "chunking",
    "retrieval",
    "reranking",
    "agents",
    "core",
    "model_gateway",
    "evaluation",
    "observability",
    "workers",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "miniopy_async.*",
    "jose.*",
    "docling.*",
    "google.genai.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
