# Render Blueprint — free-tier deployment of OmniMind.
#
# Uses Dockerfile.slim, not the full Dockerfile. The difference matters: the full
# image is 3.66GB and peaks at 792MB RSS while ingesting a document, because Docling
# pulls in PyTorch. Render's free web service caps at 512MB, so the full image is
# OOM-killed on the first upload. The slim image measured 757MB on disk and 173MB
# peak during a successful ingest under a hard 512MB cap — verified locally before
# this file was written, not assumed.
#
# What the slim build gives up: Docling's structure-aware parsing (tables and figures
# become plain text via pypdf/python-docx/openpyxl) and the local FlashRank reranking
# fallback. Reranking therefore depends on Cohere being reachable. Everything else —
# hybrid retrieval, the agent graph, citations, the faithfulness critic, guardrails,
# multi-turn memory, voice — is unchanged.

services:
  - type: web
    name: omnimind
    runtime: docker
    dockerfilePath: ./Dockerfile.slim
    plan: free
    region: singapore          # closest Render region to India — lowest RTT
    healthCheckPath: /health
    envVars:
      # Supplied automatically from the database block below, so the connection
      # string is never copy-pasted or committed.
      - key: DATABASE_URL
        fromDatabase:
          name: omnimind-db
          property: connectionString

      - key: ENVIRONMENT
        value: production

      # Generated by Render once and then held stable. Rotating this on every deploy
      # would invalidate every issued JWT and silently log users out mid-session.
      - key: JWT_SECRET_KEY
        generateValue: true

      # Serving unauthenticated requests as a demo user would collapse tenant
      # isolation, since tenant_id derives from the resolved user.
      - key: ALLOW_DEMO_USER_FALLBACK
        value: "false"

      # Render's filesystem is ephemeral and wiped on each deploy and idle spin-down.
      # Uploaded originals therefore do not survive a restart; the vectors do, because
      # Pinecone is external. Acceptable for a demo, and the reason STORAGE_BACKEND is
      # local rather than pointing at a bucket that does not exist.
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /data/objects

      # No Redis on the free plan. api/cache.py already falls back to an in-process
      # cache when Redis is unreachable — a tested path, not an accident.

      # Secrets: set these in the Render dashboard, never in this file. Marked sync:false
      # so Render prompts for them at deploy time instead of expecting a value here.
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_HOST
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false

databases:
  - name: omnimind-db
    plan: free
    region: singapore
    # Free Postgres on Render expires 30 days after creation. Fine for a demo;
    # recreate it (and redeploy) if this is still running past that.
